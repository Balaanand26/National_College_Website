<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel Slider</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: white;
        color: white;
      }

      /* CAROUSEL */
      .carousel {
        margin: 100px auto;
        background-color: black;
        position: relative;
        width: 40%;
        height: 150px;
        overflow: hidden;
        border-radius: 150px;
      }

      /* SLIDES CONTAINER */
      .slides {
        display: flex;
        width: 300%;
        height: 100%;
        transition: transform 0.6s ease-in-out;
      }

      /* EACH SLIDE */
      .slide {
        width: 100%;
        height: 100%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 80px;
      }

      /* CONTENT */
      .content {
        width: 100%;
      }


      /* NAV BUTTONS */
      .nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 20px;
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        padding: 10px;
        cursor: pointer;
      }

      .prev {
        left: 20px;
      }
      .next {
        right: 20px;
      }
    </style>
  </head>
  <body>
    <div class="carousel">
      <div class="slides" id="slides">
        <!-- SLIDE 1 -->
        <div class="slide">
          <div class="content">
            <h1>Explore Nature</h1>
            <p>Discover beautiful landscapes and peaceful environments.</p>
            <button>Learn More</button>
          </div>
        </div>

        <!-- SLIDE 2 -->
        <div class="slide">
          <div class="content">
            <h1>Creative Design</h1>
            <p>Build modern UI with smooth animations and layouts.</p>
            <button>View Work</button>
          </div>
        </div>

        <!-- SLIDE 3 -->
        <div class="slide">
          <div class="content">
            <h1>Professional Growth</h1>
            <p>Upgrade your skills and build real-world projects.</p>
            <button>Get Started</button>
          </div>
        </div>
      </div>

      <!-- NAVIGATION -->
      <button class="nav-btn prev" onclick="prevSlide()">❮</button>
      <button class="nav-btn next" onclick="nextSlide()">❯</button>
    </div>

    <script>
      let index = 0;
      const slides = document.getElementById("slides");
      const dots = document.querySelectorAll(".dot");

      function updateSlide() {
        slides.style.transform = `translateX(-${index * 100}%)`;

        dots.forEach((dot) => dot.classList.remove("active"));
        dots[index].classList.add("active");
      }

      function nextSlide() {
        index = (index + 1) % 3;
        updateSlide();
      }

      function prevSlide() {
        index = (index - 1 + 3) % 3;
        updateSlide();
      }

      function goToSlide(i) {
        index = i;
        updateSlide();
      }

      /* AUTO SLIDE */
      setInterval(nextSlide, 4000);
    </script>
  </body>
</html>
